services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    # Data Scrubber - shared GDPR scrubbing + IP anonymization (sdk-core superset)
    ApplicationLogger\Sdk\DataScrubber:
        arguments:
            $scrubFields: '%application_logger.scrub_fields%'

    # API Client - @deprecated compat facade over sdk-core Hub + SessionApiClient
    ApplicationLogger\Bundle\Service\ApiClient:
        deprecated:
            package: 'applogger/symfony-bundle'
            version: '2.0'
            message: 'The "%service_id%" service is deprecated since applogger/symfony-bundle 2.0. Inject SdkClientFactory/SessionApiClient directly.'
        arguments:
            $factory: '@ApplicationLogger\Bundle\Service\Sdk\SdkClientFactory'
            $sessions: '@ApplicationLogger\Bundle\Service\Sdk\SessionApiClient'

    # Context Collector - gathers request/user/server context
    ApplicationLogger\Bundle\Service\ContextCollector:
        arguments:
            $scrubber: '@ApplicationLogger\Sdk\DataScrubber'
            $release: '%application_logger.release%'
            $environment: '%application_logger.environment%'
            $requestStack: '@request_stack'

    # Breadcrumb Collector - tracks user actions
    ApplicationLogger\Bundle\Service\BreadcrumbCollector:
        arguments:
            $maxBreadcrumbs: '%application_logger.max_breadcrumbs%'

    # sdk-core clock + circuit breaker for the session pipeline.
    # SessionApiClient type-hints ApplicationLogger\Sdk\CircuitBreaker (sdk-core), so we
    # must register the sdk-core breaker separately and inject it — NOT the bundle breaker.
    ApplicationLogger\Sdk\Clock\SystemClock: ~

    ApplicationLogger\Sdk\CircuitBreaker:
        arguments:
            $cache: '@cache.app'
            $clock: '@ApplicationLogger\Sdk\Clock\SystemClock'
            $failureThreshold: '%application_logger.circuit_breaker.failure_threshold%'
            $openSeconds: '%application_logger.circuit_breaker.timeout%'
            $cacheKey: 'applogger.session.breaker'

    # sdk-core shared services — wired here so ExceptionSubscriber (Task 7) and future
    # rewires (Tasks 8/9) all share one factory instance.

    ApplicationLogger\Bundle\Service\Sdk\BundleContextCollector:
        arguments:
            $inner: '@ApplicationLogger\Bundle\Service\ContextCollector'

    ApplicationLogger\Bundle\Service\Sdk\LoopbackGuard:
        arguments:
            $requestStack: '@request_stack'
            $ingestPaths: '%application_logger.loopback_paths%'

    ApplicationLogger\Bundle\Service\Sdk\SdkClientFactory:
        arguments:
            $config: '%application_logger.sdk_config%'
            $context: '@ApplicationLogger\Bundle\Service\Sdk\BundleContextCollector'
            $loopback: '@ApplicationLogger\Bundle\Service\Sdk\LoopbackGuard'
            $logger: '@?monolog.logger.application_logger_internal'

    # Worker-mode PII guard: reset the per-request Scope at REQUEST. No args.
    ApplicationLogger\Bundle\EventSubscriber\ScopeResetSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    # Exception Subscriber - captures uncaught exceptions via sdk-core Hub
    ApplicationLogger\Bundle\EventSubscriber\ExceptionSubscriber:
        arguments:
            $factory: '@ApplicationLogger\Bundle\Service\Sdk\SdkClientFactory'
            $contextCollector: '@ApplicationLogger\Bundle\Service\ContextCollector'
            $debug: '%application_logger.debug%'
            $enabled: '%application_logger.enabled%'
            $errorTrackingEnabled: '%application_logger.error_tracking_enabled%'
        tags:
            - { name: kernel.event_subscriber }

    # Session API Client - slim bundle-owned session transport (create/addEvent/endSession/flush)
    ApplicationLogger\Bundle\Service\Sdk\SessionApiClient:
        arguments:
            $dsn: '%application_logger.dsn%'
            $apiKey: '%application_logger.api_key%'
            $httpClient: '@http_client'
            $loopback: '@ApplicationLogger\Bundle\Service\Sdk\LoopbackGuard'
            $breaker: '@ApplicationLogger\Sdk\CircuitBreaker'
            $enabled: '%application_logger.enabled%'
            $timeout: '%application_logger.timeout%'

    # Session Tracking Subscriber - automatically tracks user sessions
    ApplicationLogger\Bundle\EventSubscriber\SessionTrackingSubscriber:
        arguments:
            $sessionClient: '@ApplicationLogger\Bundle\Service\Sdk\SessionApiClient'
            $enabled: '%application_logger.session_tracking.enabled%'
            $trackPageViews: '%application_logger.session_tracking.track_page_views%'
            $idleTimeout: '%application_logger.session_tracking.idle_timeout%'
            $ignoredRoutes: '%application_logger.session_tracking.ignored_routes%'
            $ignoredPaths: '%application_logger.session_tracking.ignored_paths%'
            $scrubber: '@ApplicationLogger\Sdk\DataScrubber'
            $logger: '@?monolog.logger.application_logger_internal'
        tags:
            - { name: kernel.event_subscriber }

    # Monolog Handler - routes exceptions to errors (Hub::captureEvent), plain logs to log aggregation (LogClient)
    ApplicationLogger\Bundle\Monolog\Handler\ApplicationLoggerHandler:
        arguments:
            $factory: '@ApplicationLogger\Bundle\Service\Sdk\SdkClientFactory'
            $contextCollector: '@ApplicationLogger\Bundle\Service\ContextCollector'
            $scrubber: '@ApplicationLogger\Sdk\DataScrubber'
            $loopback: '@ApplicationLogger\Bundle\Service\Sdk\LoopbackGuard'
            $enabled: '%application_logger.enabled%'
            $captureLevel: '%application_logger.capture_level%'
            $environment: '%application_logger.environment%'
            $errorTrackingEnabled: '%application_logger.error_tracking_enabled%'
            $logAggregationEnabled: '%application_logger.log_aggregation_enabled%'

    # CSP Nonce Provider - resolves + escapes the CSP nonce for injected <script> tags
    ApplicationLogger\Bundle\Twig\CspNonceProvider:
        arguments:
            $requestStack: '@request_stack'

    # Script Renderer - owns the JS SDK <script> generation (SRP, extracted from the
    # Twig extension). Emits byte-identical output via the CSP nonce provider.
    ApplicationLogger\Bundle\Twig\ScriptRenderer:
        arguments:
            $nonceProvider: '@ApplicationLogger\Bundle\Twig\CspNonceProvider'
            $security: '@?security.helper'
            $logger: '@?monolog.logger.application_logger_internal'
            # Optional: when AssetMapper is present, the SDK module is imported from its
            # resolved public URL so no host importmap entry is required (works on install).
            $assetMapper: '@?asset_mapper'

    # Twig Extension - provides application_logger_init() function
    ApplicationLogger\Bundle\Twig\ApplicationLoggerExtension:
        arguments:
            $config:
                enabled: '%application_logger.javascript.enabled%'
                dsn: '%application_logger.dsn%'
                api_key: '%application_logger.api_key%'
                environment: '%application_logger.javascript.environment%'
                release: '%application_logger.javascript.release%'
                debug: '%application_logger.javascript.debug%'
                scrub_fields: '%application_logger.javascript.scrub_fields%'
                # Session replay knobs, forwarded verbatim to the JS SDK (snake->camel
                # mapping happens in the Twig extension's buildSessionReplayConfig()).
                session_replay:
                    enabled: '%application_logger.session_replay.enabled%'
                    buffer_before_error_seconds: '%application_logger.session_replay.buffer_before_error_seconds%'
                    buffer_before_error_clicks: '%application_logger.session_replay.buffer_before_error_clicks%'
                    buffer_after_error_seconds: '%application_logger.session_replay.buffer_after_error_seconds%'
                    buffer_after_error_clicks: '%application_logger.session_replay.buffer_after_error_clicks%'
                    click_debounce_ms: '%application_logger.session_replay.click_debounce_ms%'
                    snapshot_throttle_ms: '%application_logger.session_replay.snapshot_throttle_ms%'
                    max_snapshot_size: '%application_logger.session_replay.max_snapshot_size%'
                    session_timeout_minutes: '%application_logger.session_replay.session_timeout_minutes%'
                    max_buffer_size_mb: '%application_logger.session_replay.max_buffer_size_mb%'
                    expose_api: '%application_logger.session_replay.expose_api%'
            $scriptRenderer: '@ApplicationLogger\Bundle\Twig\ScriptRenderer'
            $logger: '@?monolog.logger.application_logger_internal'
            $requestStack: '@request_stack'
        tags:
            - { name: twig.extension }

    # Flush Telemetry Subscriber - drives pending async POSTs to completion after the
    # response is sent (kernel.terminate), so fire-and-forget telemetry is reliably
    # delivered in per-request SAPIs (PHP-FPM, FrankenPHP non-worker mode) without
    # ever blocking the user-visible response.
    ApplicationLogger\Bundle\EventSubscriber\FlushTelemetrySubscriber:
        arguments:
            $factory: '@ApplicationLogger\Bundle\Service\Sdk\SdkClientFactory'
            $sessions: '@ApplicationLogger\Bundle\Service\Sdk\SessionApiClient'
        tags:
            - { name: kernel.event_subscriber }

    # JavaScript Injection Subscriber - auto-injects SDK on HTML pages
    ApplicationLogger\Bundle\EventSubscriber\JavaScriptInjectionSubscriber:
        arguments:
            $autoInject: '%application_logger.javascript.auto_inject%'
            $enabled: '%application_logger.javascript.enabled%'
            $twigExtension: '@ApplicationLogger\Bundle\Twig\ApplicationLoggerExtension'
        tags:
            - { name: kernel.event_subscriber }

    # Aliases for easier access
    application_logger.api_client:
        alias: ApplicationLogger\Bundle\Service\ApiClient
        public: true

    application_logger.breadcrumbs:
        alias: ApplicationLogger\Bundle\Service\BreadcrumbCollector
        public: true

    application_logger.context_collector:
        alias: ApplicationLogger\Bundle\Service\ContextCollector
        public: true
